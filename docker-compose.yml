version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: appwrite-backend
    ports:
      - "8030:8030"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests,sys; sys.exit(0) if requests.get('http://localhost:8030/docs').status_code==200 else sys.exit(1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
